<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Optimizer | Dark Cherry</title>
    <style>
        :root {
            --bg-color: #0f0c0c;
            --card-bg: #1a1515;
            --primary: #9b1b30; /* Cereja */
            --primary-hover: #721021; /* Vinho */
            --accent: #4a0e0e; /* Grená */
            --text-color: #e0e0e0;
            --border-color: #332a2a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 900px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary);
        }

        textarea {
            width: 100%;
            height: 300px;
            background-color: #120d0d;
            border: 1px solid var(--border-color);
            color: white;
            padding: 15px;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        button {
            width: 100%;
            max-width: 300px;
            padding: 15px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-optimize {
            background-color: var(--primary);
            color: white;
        }

        .btn-optimize:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-download {
            background-color: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            display: none; /* Escondido até ter o currículo pronto */
        }

        .btn-download:hover {
            background-color: var(--primary);
            color: white;
        }
        .markdown-alert {
            background-color: rgba(155, 27, 48, 0.1);
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .markdown-alert b {
            color: var(--primary);
        }

        .markdown-alert code {
            background: #000;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }

        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        .loader {
            border: 4px solid #f3f3f31a;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Resume Optimizer</h1>
    
    <div class="grid">
        <div>
            <label>Seu Currículo (Texto)</label>
            <textarea id="resumeText" placeholder="Cole aqui seu currículo atual..."></textarea>
        </div>
        <div>
            <label>Descrição da Vaga</label>
            <textarea id="jobDescription" placeholder="Cole aqui a descrição da vaga dos sonhos..."></textarea>
        </div>
    </div>

    <div class="actions">
        <div class="loader" id="loader"></div>
        <button class="btn-optimize" id="optimizeBtn" onclick="optimize()">Otimizar Currículo</button>
        
        <div id="editorContainer" style="display: none; width: 100%; margin-top: 20px;">
            <div class="markdown-alert">
                <b>💡 Dica de Edição:</b> O texto abaixo usa formatação Markdown para garantir a estrutura do seu PDF. 
                Procure editar <u>apenas o conteúdo das palavras</u>. 
                Mantenha os símbolos como <code>#</code> (Títulos), <code>##</code> (Seções) e <code>-</code> (Listas) para que o layout saia perfeito.
            </div>
            <label>Revise e Edite seu Currículo Otimizado:</label>
            <textarea id="editableResume" style="height: 400px; border-color: var(--primary);"></textarea>
            <button class="btn-download" id="downloadBtn" onclick="downloadPDF()" style="display: block; margin: 20px auto;">Baixar PDF Final</button>
        </div>
        
        <div id="status"></div>
    </div>
</div>

<script>
    let optimizedText = "";

    async function optimize() {
        const resume = document.getElementById('resumeText').value;
        const job = document.getElementById('jobDescription').value;
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');
        
        // Elementos que precisam aparecer
        const editorContainer = document.getElementById('editorContainer');
        const editableResume = document.getElementById('editableResume');

        if (!resume || !job) {
            alert("Preencha currículo e vaga!"); return;
        }

        status.innerText = "IA Otimizando... Aguarde.";
        loader.style.display = "block";
        editorContainer.style.display = "none"; // Esconde enquanto carrega

        try {
            const response = await fetch('http://localhost:8000/optimize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ resume_text: resume, job_description: job })
            });

            const result = await response.json();
            console.log("Resposta da IA:", result); // Verifique isso no F12

            if (result.status === "sucesso") {
                // 1. Injeta o texto no editor
                editableResume.value = result.data.curriculo_otimizado;
                
                // 2. FORÇA a exibição do container
                editorContainer.style.setProperty('display', 'block', 'important');
                
                // 3. Atualiza o status
                status.innerText = "Otimização concluída! Score: " + result.data.match_score_otimizado + "%";

                editorContainer.scrollIntoView({ behavior: 'smooth' });
                
            } else {
                status.innerText = "Erro: " + (result.detail || "Falha na otimização");
            }
        } catch (error) {
            status.innerText = "Erro ao conectar ao servidor. Verifique se o Backend está rodando.";
            console.error(error);
        } finally {
            loader.style.display = "none";
        }
    }

    async function downloadPDF() {
        // Agora pegamos o texto do campo EDITÁVEL, não da variável global
        const textToExport = document.getElementById('editableResume').value;
        const status = document.getElementById('status');
        status.innerText = "Gerando PDF...";

        try {
            const response = await fetch('http://localhost:8000/download-pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ curriculo_otimizado: textToExport })
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "curriculo_revisado.pdf";
                a.click();
                status.innerText = "Download concluído!";
            }
        } catch (error) {
            status.innerText = "Erro ao gerar arquivo.";
        }
    }
</script>

</body>
</html>
